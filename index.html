<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="墨衡小卦：支持经传来源追溯、自由追问与三钱起卦的轻量《周易》RAG 虚拟人。" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2311100f'/%3E%3Ccircle cx='32' cy='32' r='21' fill='%23cfb083'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-size='28' fill='%236b271d'%3E%E5%AE%88%3C/text%3E%3C/svg%3E" />
    <title>墨衡小卦 · 守简版</title>
    <style>
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; padding: 0 24px 36px; background: #080c0c; background-image: radial-gradient(ellipse at 50% -22%, #34454180, transparent 60%), radial-gradient(circle at 94% 78%, #49302040, transparent 36%); }
      body::before { content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .16; background: repeating-linear-gradient(90deg, transparent 0 3px, #f1d4a008 4px 5px); }
      .entry-gate { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; overflow: hidden; isolation: isolate; color: #f0dec0; background: radial-gradient(circle at 50% 50%, #53645d 0, #142120 24%, #050a0a 65%); font-family: "Noto Serif SC", "Songti SC", serif; }
      .entry-gate[hidden] { display: none; }
      .gate-light { position: absolute; inset: 0; z-index: -1; background: radial-gradient(ellipse 13% 75% at 50% 50%, #f4daa288, #a3774340 37%, transparent 100%); filter: blur(14px); }
      .gate-wing { position: absolute; top: -4%; bottom: -4%; width: 51%; background: repeating-linear-gradient(90deg, #100e0b 0 6px, #3c271c 7px 11px, #1c1511 16px 28px), linear-gradient(#4e3321,#15100c); border: 2px solid #95724c; box-shadow: inset 0 0 0 16px #130f0ce6, inset 0 0 0 18px #a4815366, inset 0 0 80px #000, 0 0 90px #000; transition: transform 1.25s cubic-bezier(.65,.08,.14,1), filter 1.25s; }
      .gate-wing::before { content: ""; position: absolute; inset: 8% 9%; border: 1px solid #ad8b594d; background: repeating-linear-gradient(0deg, transparent 0 68px, #a8894a2b 69px 71px), repeating-linear-gradient(90deg, transparent 0 68px, #a8894a2b 69px 71px); }
      .gate-wing::after { content: ""; position: absolute; top: 48%; width: 22px; height: 42px; border: 1px solid #d1ad73; background: linear-gradient(110deg,#e2bb77,#6d4c2a); box-shadow: 0 0 16px #d8a86144; }
      .gate-wing.left { left: 0; transform-origin: left center; border-right: 4px solid #d5b177; }
      .gate-wing.left::after { right: 28px; }
      .gate-wing.right { right: 0; transform-origin: right center; border-left: 4px solid #d5b177; }
      .gate-wing.right::after { left: 28px; }
      .gate-words { position: relative; z-index: 2; display: grid; justify-items: center; gap: 10px; width: min(82vw, 540px); padding: 30px; text-align: center; background: #0d1413a8; border: 1px solid #d2b77e77; box-shadow: 0 20px 100px #000b; backdrop-filter: blur(12px); transition: opacity .35s, transform .65s; }
      .gate-seal { display: grid; place-items: center; width: 48px; height: 48px; margin-bottom: 6px; border: 1px solid #b4895d; color: #e9d2a0; font-size: 29px; }
      .gate-words small { font: 11px/1.6 system-ui,sans-serif; letter-spacing: .35em; color: #c2aa82; }
      .gate-words h2 { margin: 5px 0; font-size: clamp(34px,6vw,64px); font-weight: 500; letter-spacing: .17em; }
      .gate-words p { margin: 0 0 16px; color: #d7c7ac; font-size: 15px; letter-spacing: .08em; }
      .gate-words button { min-width: 172px; min-height: 48px; border: 1px solid #c8a476; border-radius: 3px; background: #b79565; color: #131918; font: 600 16px "Noto Serif SC","Songti SC",serif; cursor: pointer; }
      .gate-words button:hover { background: #e0c08c; }
      .entry-gate.opening .left { transform: perspective(1100px) rotateY(-105deg); filter: brightness(.45); }
      .entry-gate.opening .right { transform: perspective(1100px) rotateY(105deg); filter: brightness(.45); }
      .entry-gate.opening .gate-words { opacity: 0; transform: translateY(22px); pointer-events: none; }
      .entry-gate.opening { animation: gate-away 1.3s ease-in forwards; }
      @keyframes gate-away { 0%,18% { opacity: 1; } 100% { opacity: 0; visibility: hidden; } }
      @media(max-width:600px) { body { padding: 0 10px 24px; } .gate-wing::before { inset: 6% 5%; } .gate-words { width: 82vw; padding: 22px 12px; } }
      @media(prefers-reduced-motion:reduce) { .entry-gate { display: none; } }
    </style>
    <script type="module" src="./src/shoujian-oracle.js"></script>
    <script type="module" src="./src/entry-gate.js"></script>
  </head>
  <body>
    <div class="entry-gate" role="dialog" aria-modal="true" aria-label="进入守简" hidden>
      <div class="gate-light" aria-hidden="true"></div>
      <div class="gate-wing left" aria-hidden="true"></div><div class="gate-wing right" aria-hidden="true"></div>
      <div class="gate-words"><span class="gate-seal" aria-hidden="true">守</span><small>SHOUJIAN · 一室观心</small><h2>推门 · 问心</h2><p>一事一问，借古意照见眼前。</p><button type="button" data-enter-gate>推门入境</button></div>
    </div>
    <shoujian-oracle></shoujian-oracle>
  </body>
</html>
